services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hyperclients-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - ENVIRONMENT=production
      - FRONTEND_URL=${FRONTEND_URL:-https://hyperclients.ai}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    networks:
      - hyperclients-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hyperclients-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - hyperclients-network

networks:
  hyperclients-network:
    driver: bridge